# One binary per OS and architecture, with the web app embedded (static on linux).
# A pushed v* tag runs .github/workflows/release.yml, which publishes the
# GitHub release and the Homebrew cask in arafathusayn/homebrew-tap.
version: 2

project_name: herdsman

# Repository mode: vendored code only, with the module proxy switched off.
# See MAINTAINING.md, Build modes.
env:
  - GOFLAGS=-mod=vendor
  - GOPROXY=off

before:
  hooks:
    - make web

builds:
  # cgo for the SQLite driver. release.yml runs on a macOS runner: darwin
  # builds with its clang, linux with zig cc against musl, linked
  # statically. (zig ships no macOS frameworks, and the darwin link needs
  # Security and CoreFoundation for crypto/x509.) The darwin binaries run
  # on macOS 13 and later, as the pure-Go build did: without
  # MACOSX_DEPLOYMENT_TARGET the link takes the build host's macOS version
  # as the minimum. HERDSMAN_BUILD_TAGS is
  # empty for a release; release-build.yml sets it to cgoprobe.
  - id: herdsman
    main: ./cmd/herdsman
    binary: herdsman
    env:
      - CGO_ENABLED=1
    # A fixed time for the file, so that the archives can match byte for byte.
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    tags:
      - '{{ envOrDefault "HERDSMAN_BUILD_TAGS" "" }}'
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }}
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    overrides:
      - goos: darwin
        goarch: amd64
        env:
          - CC=clang -arch x86_64
          - CXX=clang++ -arch x86_64
          - MACOSX_DEPLOYMENT_TARGET=13.0
      - goos: darwin
        goarch: arm64
        env:
          - CC=clang -arch arm64
          - CXX=clang++ -arch arm64
          - MACOSX_DEPLOYMENT_TARGET=13.0
      - goos: linux
        goarch: amd64
        env:
          - CC=zig cc -target x86_64-linux-musl
          - CXX=zig c++ -target x86_64-linux-musl
        ldflags:
          - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -linkmode external -extldflags -static
      - goos: linux
        goarch: arm64
        env:
          - CC=zig cc -target aarch64-linux-musl
          - CXX=zig c++ -target aarch64-linux-musl
        ldflags:
          - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -linkmode external -extldflags -static

archives:
  - id: herdsman
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Fixed times and owners: without them the archive holds the checkout's,
    # and two builds of one tag have different checksums.
    builds_info:
      mtime: "{{ .CommitDate }}"
      owner: root
      group: root
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
          owner: root
          group: root
          mode: 0o644
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
          owner: root
          group: root
          mode: 0o644
      - src: docs/man/*.1
        info:
          mtime: "{{ .CommitDate }}"
          owner: root
          group: root
          mode: 0o644

checksum:
  name_template: checksums.txt

# One document for the release: every upstream the binaries carry, from each
# VENDOR.md, the SQLite inside the driver, and the web app's submodule. Code
# that only tests use (a conformance folder) stays out, by rule; see
# internal/update/sbom.go. The commit date keeps two builds identical.
sboms:
  - id: herdsman
    artifacts: any
    documents:
      - "{{ .ProjectName }}_{{ .Version }}.spdx.json"
    cmd: go
    # GoReleaser clears the environment of this command.
    env:
      - GOFLAGS=-mod=vendor
      - GOPROXY=off
      - GOCACHE={{ envOrDefault "GOCACHE" "" }}
    args:
      - run
      - ../internal/update/releasetool
      - sbom
      - --zig-version
      # The zig of release.yml: the linux binaries link its musl statically.
      - 0.17.0
      - --root
      - ..
      - --version
      - "{{ .Version }}"
      - --created
      - "{{ .CommitDate }}"
      - --out
      - "$document"

# herdsman update trusts this signature. The private key comes from the
# environment, and the tool stops when the key is absent or when the binaries
# do not trust it, so an unsigned release cannot be published.
signs:
  - id: checksums
    artifacts: checksum
    signature: "${artifact}.sig"
    cmd: go
    args:
      - run
      - ./internal/update/releasetool
      - sign
      - --in
      - "${artifact}"
      - --out
      - "${signature}"

homebrew_casks:
  - name: herdsman
    repository:
      owner: arafathusayn
      name: homebrew-tap
      branch: main
      # A deploy key with write access to the tap repository only.
      git:
        url: git@github.com:arafathusayn/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_SSH_KEY }}"
    homepage: https://github.com/arafathusayn/herdsman
    description: Run a whole team of coding agents from one conversation, and from the browser.
    license: GPL-3.0-only
    binaries: [herdsman]
    # The pages for each command are in the archive beside this one.
    manpages:
      - docs/man/herdsman.1
    hooks:
      post:
        # The binary is not notarized; let macOS run it without the quarantine prompt.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/herdsman"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
