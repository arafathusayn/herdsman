name: vuln

# Known vulnerabilities, daily: govulncheck on the code paths herdsman uses, and
# OSV on every version a VENDOR.md pins, reachable from the code or not.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Pinned Go tools
        run: make tools-go
      - name: Check
        run: make vuln
