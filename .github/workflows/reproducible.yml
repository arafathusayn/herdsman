name: reproducible

# Runs the real release build of a tag twice, each with an empty build cache,
# and fails when any release binary differs. macOS, as release.yml: darwin needs
# its clang, and linux cross-compiles with zig.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Pinned Go tools
        run: make tools-go
      - name: Build twice and compare
        env:
          GORELEASER: .tools/bin/goreleaser
        run: .github/scripts/reproducible-build.sh
