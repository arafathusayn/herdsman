name: fuzz

# Each night, every native fuzz target for a fixed time, starting from the
# corpus committed under its package. A failure keeps the input that broke it.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=vendor
  GOPROXY: "off"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Every target, one minute each
        run: .github/scripts/fuzz-nightly.sh 60s . sdk
      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          retention-days: 30
