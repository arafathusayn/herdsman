name: sdk-consumer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  external-consumer:
    # A throwaway module outside the checkout requires the SDK at the commit
    # under test and builds with the repository's settings out of reach.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the consumer
        # On a pull request github.sha is a merge commit Go cannot fetch by id;
        # the head commit is the one that was pushed.
        run: .github/scripts/sdk-consumer.sh "${{ github.event.pull_request.head.sha || github.sha }}"
