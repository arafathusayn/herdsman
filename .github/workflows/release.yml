name: release

# A pushed v* tag builds the binaries, publishes the GitHub release and
# writes the Homebrew cask to arafathusayn/homebrew-tap (through a deploy key).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Bun types (global, outside the repo)
        run: make tools
      - name: Check
        run: make check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
