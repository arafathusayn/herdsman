name: release

# A pushed v* tag builds the release twice and stops unless the checksums
# match, then publishes the signed GitHub release, writes the Homebrew cask to
# arafathusayn/homebrew-tap (through a deploy key) and attests the provenance.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Provenance: the keyless identity of this run, and the attestation store.
  id-token: write
  attestations: write

jobs:
  release:
    # macOS: the darwin binaries link with its clang (cgo), and zig cc
    # cross-compiles the linux ones (.goreleaser.yaml).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Bun types (global, outside the repo)
        run: make tools
      - name: Check
        run: make check
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0
      # Each build starts from an empty cache and leaves publishing and signing
      # out, so nothing reaches anyone unless both agree.
      - name: Build the tag twice and compare checksums
        run: |
          set -eu
          for run in first second; do
            GOCACHE="$RUNNER_TEMP/cache-$run" .tools/bin/goreleaser release --clean --skip=publish,sign,homebrew
            cp dist/checksums.txt "$RUNNER_TEMP/checksums-$run.txt"
          done
          cmp "$RUNNER_TEMP/checksums-first.txt" "$RUNNER_TEMP/checksums-second.txt"
      - name: Publish
        run: .tools/bin/goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          HERDSMAN_RELEASE_SIGNING_KEY: ${{ secrets.HERDSMAN_RELEASE_SIGNING_KEY }}
      - name: The published build matches the compared ones
        run: cmp "$RUNNER_TEMP/checksums-first.txt" dist/checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
