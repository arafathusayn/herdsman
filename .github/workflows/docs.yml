name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generated-pages:
    # The reference pages are rendered from the binary's own specs, so a
    # change to a command or to the configuration has to carry its pages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Regenerate
        run: make docs
      - name: The tree is unchanged
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git --no-pager diff
            echo "run make docs and commit the result"
            exit 1
          fi
