name: release-build

# The release build without a release: goreleaser builds the four cgo
# binaries as release.yml would, with the cgoprobe tag, which links the
# SQLite driver (cmd/herdsman/cgoprobe.go). Each artifact must be the right
# OS and architecture, linux ones statically linked, darwin ones with macOS 13
# as their minimum, and the probe must open
# a database in the darwin/arm64 binary here and the linux/amd64 one on
# Linux. The build runs the signing and SBOM steps too, with a key made for
# this run and thrown away, and checks what they wrote.

on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - .github/workflows/release-build.yml
      - cmd/herdsman/cgoprobe.go
      - internal/update/**
      - go.mod
      - go.sum

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Bun types (global, outside the repo)
        run: make tools
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0
      - name: A signing key for this run only
        run: |
          set -eu
          go run ./internal/update/releasetool keygen --seed-out "$RUNNER_TEMP/seed" --public-out "$RUNNER_TEMP/public"
          echo "::add-mask::$(cat "$RUNNER_TEMP/seed")"
          echo "HERDSMAN_RELEASE_SIGNING_KEY=$(cat "$RUNNER_TEMP/seed")" >> "$GITHUB_ENV"
      - name: Build all targets twice and compare checksums
        run: .github/scripts/release-tag.sh build --snapshot
        env:
          GORELEASER: .tools/bin/goreleaser
          HERDSMAN_BUILD_TAGS: cgoprobe
          HERDSMAN_ALLOW_UNTRUSTED_KEY: "1"
          # Only so that the cask renders; nothing is pushed from this job.
          HOMEBREW_TAP_SSH_KEY: not-a-key
      - name: The checksums verify and the SBOM is written
        run: |
          set -eu
          go run ./internal/update/releasetool verify --in dist/checksums.txt --sig dist/checksums.txt.sig --keys "$RUNNER_TEMP/public"
          grep -q 'spdx.json' dist/checksums.txt
          grep -q '"SPDX-2.3"' dist/*.spdx.json
      - name: Each binary is its target
        run: |
          set -eu
          file dist/herdsman_*/herdsman
          file dist/herdsman_darwin_arm64*/herdsman | grep -q 'Mach-O 64-bit.*arm64'
          file dist/herdsman_darwin_amd64*/herdsman | grep -q 'Mach-O 64-bit.*x86_64'
          file dist/herdsman_linux_amd64*/herdsman | grep -q 'ELF 64-bit.*x86-64.*statically linked'
          file dist/herdsman_linux_arm64*/herdsman | grep -q 'ELF 64-bit.*aarch64.*statically linked'
      - name: The darwin binaries run on macOS 13 and later
        run: |
          set -eu
          for f in dist/herdsman_darwin_arm64*/herdsman dist/herdsman_darwin_amd64*/herdsman; do
            # minos of the LC_BUILD_VERSION load command; a binary without one fails.
            m=$(otool -l "$f" | awk '$1 == "cmd" && $2 == "LC_BUILD_VERSION" { b = 1; next } b && $1 == "minos" { print $2; exit }')
            echo "$f: minos ${m:-none}"
            # The whole version against 13.0.0, a missing part read as 0: 13.0.1 fails.
            echo "${m:-none}" | awk -F. '$0 !~ /^[0-9]+(\.[0-9]+)*$/ { exit 1 } $1 + 0 > 13 { exit 1 } $1 + 0 == 13 { for (i = 2; i <= NF; i++) if ($i + 0 > 0) exit 1 }'
          done
      - name: Probe on macOS
        run: |
          dist/herdsman_darwin_arm64*/herdsman --cgo-probe | grep '^cgo probe: sqlite '
      - uses: actions/upload-artifact@v7
        with:
          name: herdsman-linux-amd64
          path: dist/herdsman_linux_amd64_v1/herdsman
          retention-days: 1

  probe-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: herdsman-linux-amd64
      - name: Probe on Linux
        run: |
          chmod +x herdsman
          ./herdsman --cgo-probe | grep '^cgo probe: sqlite '
          ./herdsman version
