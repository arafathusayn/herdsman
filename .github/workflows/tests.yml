name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    # The Go CLI and the web app inside it: format, types, tests (which
    # cover every command the skill runs), lint, known vulnerabilities,
    # then a build with the app embedded.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Bun types (global, outside the repo)
        run: make tools
      - name: Check
        run: make check
      - name: Build
        run: make build && ./bin/herdsman version
      - name: Release config
        run: make release-check
