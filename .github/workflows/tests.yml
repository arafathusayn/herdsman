name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One job per module in MODULES.md, plus the browser checks.
jobs:
  root:
    # The Go CLI with the web app embedded: format, lint, tests (which cover
    # every command the skill runs), the import guard, known vulnerabilities,
    # then a build with the app inside.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Pinned Go tools
        run: make tools-go
      - name: Check
        run: make check-root
      - name: Build
        run: make build && ./bin/herdsman version
      - name: Release config
        run: make release-check

  teardown-container:
    # Stops a real container and proves it stays on the machine. Hosted Linux
    # runners have an engine; this job must never skip the gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fixture image
        run: docker pull alpine:3
      - name: Container gate
        run: go test -p 1 -tags acceptance -count=1 -v -run '^TestAContainerIsStoppedAndKept$' ./acceptance/teardown/ | tee gate.log
      - name: The gate ran and passed
        run: grep -q '^--- PASS. TestAContainerIsStoppedAndKept' gate.log

  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Pinned Go tools
        run: make tools-go
      - name: Check
        run: make check-sdk

  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Pinned Go tools
        run: make tools-go
      - name: Check
        run: make check-conformance

  deps-verify:
    # Every module tidy, and the committed vendored tree what a re-vendor writes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify
        run: make deps-verify

  sdk-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Bun types
        run: make tools-bun
      - name: Check
        run: make check-sdk-ts

  web:
    # Format, types and tests of the web app.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Bun types (global, outside the repo)
        run: make tools-bun
      - name: Check
        run: make check-web

  web-e2e:
    # The built web app and its forms in headless Chrome against a mock API.
    # GitHub's Ubuntu image ships Google Chrome; the checks find it on PATH.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Bun types (global, outside the repo)
        run: make tools-bun
      - name: Chrome
        run: google-chrome --version
      - name: Browser checks
        run: make web-e2e
