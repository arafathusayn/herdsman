syntax = "proto3";

// Types shared by every herdsman contract. This package defines no services.
package herdsman.core.v1;

import "google/protobuf/any.proto";

option go_package = "github.com/arafathusayn/herdsman/sdk/core/v1;corev1";

// RouteId names a route.
message RouteId {
  string value = 1;
}

// MessageId names one message of a route's channel.
message MessageId {
  string value = 1;
}

// Version says which contract produced a reply.
message Version {
  // SemVer of the contract, without a leading "v".
  string contract = 1;
  // The build of the program that answered.
  string build = 2;
}

// Error is the one failure shape of every RPC.
message Error {
  // Stable and machine-readable; callers branch on this, never on message.
  string code = 1;
  // For people; the wording may change.
  string message = 2;
  repeated google.protobuf.Any details = 3;
}

// Plan is what a mutating call would do, returned before it acts.
message Plan {
  repeated PlanStep steps = 1;
}

// PlanStep is one action of a Plan.
message PlanStep {
  string action = 1;
  string target = 2;
  string description = 3;
  // True when the action cannot be undone.
  bool irreversible = 4;
}

// MessageHeader is a queued message's envelope, never its body.
message MessageHeader {
  string box = 1;
  MessageId id = 2;
  string from = 3;
  string to = 4;
  string kind = 5;
  MessageId reply_to = 6;
  // The state folder that holds the message.
  string state = 7;
  bool acknowledged = 8;
}

// ProjectId names a project.
message ProjectId {
  string value = 1;
}

// TaskId names a task.
message TaskId {
  string value = 1;
}

// ProjectRepo is one repository of a project.
message ProjectRepo {
  string name = 1;
  // Absolute. The name defaults to the last path element.
  string path = 2;
  string default_branch = 3;
  string remote = 4;
}

// Project is a project record with what hangs off it.
message Project {
  ProjectId id = 1;
  string name = 2;
  string description = 3;
  // "active" or "archived".
  string state = 4;
  repeated string folders = 5;
  repeated ProjectRepo repos = 6;
  int32 open_tasks = 7;
  // Milliseconds since the Unix epoch.
  int64 created = 8;
  int64 updated = 9;
}

// TaskLink attaches a pull request, an issue or a URL to a task's repository.
message TaskLink {
  string repo = 1;
  // "pr", "issue" or "url".
  string kind = 2;
  string target = 3;
}

// Task is a task record. Its project is fixed at creation.
message Task {
  TaskId id = 1;
  ProjectId project = 2;
  // Unique within the project; the id the worktree verbs take.
  string slug = 3;
  string title = 4;
  string body = 5;
  // "todo", "doing", "review", "done" or "archived".
  string status = 6;
  // Empty when the task runs in no route.
  RouteId route = 7;
  repeated string repos = 8;
  repeated string labels = 9;
  repeated TaskLink links = 10;
  // Milliseconds since the Unix epoch.
  int64 created = 11;
  int64 updated = 12;
}

// RuntimeRef names one execution of a runtime backend: one harness launch. It
// is added beside the pane fields of older messages, which keep their meaning
// for the herdr-tui backend only and are never filled with invented values.
message RuntimeRef {
  // "herdr-core" or "herdr-tui".
  string backend = 1;
  // A random UUID of one harness launch; empty for a legacy TUI binding that
  // predates execution records.
  string execution_id = 2;
  // Raised each time the logical agent is launched again.
  int64 generation = 3;
  // The verified endpoint: the core identity on herdr-core, the server socket
  // on herdr-tui.
  string endpoint_id = 4;
  // The core terminal address; never a reusable friendly name. Empty on
  // herdr-tui.
  string terminal_address = 5;
  // The Herdr TUI pane; empty on herdr-core.
  string pane = 6;
}
