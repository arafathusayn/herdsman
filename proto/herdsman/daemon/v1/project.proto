syntax = "proto3";

package herdsman.daemon.v1;

import "herdsman/core/v1/core.proto";

option go_package = "github.com/arafathusayn/herdsman/sdk/daemon/v1;daemonv1";

// ProjectService keeps the project records and their folder bindings.
service ProjectService {
  // Create stores a project and registers its repositories.
  rpc Create(ProjectServiceCreateRequest) returns (ProjectServiceCreateResponse);
  // Get returns one project.
  rpc Get(ProjectServiceGetRequest) returns (ProjectServiceGetResponse);
  // List returns the projects by name.
  rpc List(ProjectServiceListRequest) returns (ProjectServiceListResponse);
  // Update changes a project's fields and repositories.
  rpc Update(ProjectServiceUpdateRequest) returns (ProjectServiceUpdateResponse);
  // Delete removes a project, or archives it when forced.
  rpc Delete(ProjectServiceDeleteRequest) returns (ProjectServiceDeleteResponse);
  // Bind ties a folder to a project.
  rpc Bind(ProjectServiceBindRequest) returns (ProjectServiceBindResponse);
  // Unbind releases a folder.
  rpc Unbind(ProjectServiceUnbindRequest) returns (ProjectServiceUnbindResponse);
  // ContextInit lays out the project's knowledge and history folders.
  rpc ContextInit(ProjectServiceContextInitRequest) returns (ProjectServiceContextInitResponse);
  // ContextCheck validates the project's history.
  rpc ContextCheck(ProjectServiceContextCheckRequest) returns (ProjectServiceContextCheckResponse);
  // ContextNote adds a note to the project's history.
  rpc ContextNote(ProjectServiceContextNoteRequest) returns (ProjectServiceContextNoteResponse);
  // Log reads the project's history in order.
  rpc Log(ProjectServiceLogRequest) returns (ProjectServiceLogResponse);
}

// Scope is where a caller stands when a reference needs resolving.
message Scope {
  // A project name, an id, or "@" for the current one. Empty when not given.
  string project = 1;
  // The caller's absolute working folder.
  string folder = 2;
  // The route the caller runs in, when any.
  herdsman.core.v1.RouteId route = 3;
}

message ProjectServiceCreateRequest {
  string name = 1;
  string description = 2;
  repeated herdsman.core.v1.ProjectRepo repos = 3;
  // An absolute folder to bind right away; empty for none.
  string folder = 4;
}

message ProjectServiceCreateResponse {
  herdsman.core.v1.Project project = 1;
}

message ProjectServiceGetRequest {
  Scope scope = 1;
}

message ProjectServiceGetResponse {
  herdsman.core.v1.Project project = 1;
}

message ProjectServiceListRequest {
  bool include_archived = 1;
}

message ProjectServiceListResponse {
  repeated herdsman.core.v1.Project projects = 1;
}

message ProjectServiceUpdateRequest {
  Scope scope = 1;
  optional string name = 2;
  optional string description = 3;
  repeated herdsman.core.v1.ProjectRepo add_repos = 4;
  repeated string remove_repos = 5;
}

message ProjectServiceUpdateResponse {
  herdsman.core.v1.Project project = 1;
}

message ProjectServiceDeleteRequest {
  Scope scope = 1;
  bool force = 2;
}

message ProjectServiceDeleteResponse {}

message ProjectServiceBindRequest {
  Scope scope = 1;
  // The absolute folder to bind.
  string folder = 2;
}

message ProjectServiceBindResponse {
  herdsman.core.v1.Project project = 1;
}

message ProjectServiceUnbindRequest {
  // The absolute folder to release.
  string folder = 1;
}

message ProjectServiceUnbindResponse {
  herdsman.core.v1.Project project = 1;
}

// ContextEvent is one entry of a project's history.
message ContextEvent {
  string id = 1;
  string kind = 2;
  // Milliseconds since the Unix epoch.
  int64 at = 3;
  string actor = 4;
  string task = 5;
  repeated string repos = 6;
  // Empty for an event that starts the history.
  repeated string parents = 7;
  // The commit of each repository, by repository name.
  map<string, string> commits = 8;
  // Header keys this version of the contract does not name, as written.
  map<string, string> extra = 9;
  string body = 10;
}

// ContextProblem is one thing wrong with one event file.
message ContextProblem {
  string file = 1;
  // "malformed", "missing-parent", "cycle" or "not-monotone".
  string code = 2;
  // For people; the wording may change.
  string detail = 3;
}

message ProjectServiceContextInitRequest {
  Scope scope = 1;
}

message ProjectServiceContextInitResponse {
  // The absolute folder that now holds the layout.
  string folder = 1;
}

message ProjectServiceContextCheckRequest {
  Scope scope = 1;
}

message ProjectServiceContextCheckResponse {
  // How many event files parsed.
  int32 events = 1;
  // Empty when the history is sound.
  repeated ContextProblem problems = 2;
}

message ProjectServiceContextNoteRequest {
  Scope scope = 1;
  // Who is writing: a person or an agent.
  string actor = 2;
  string task = 3;
  repeated string repos = 4;
  // Empty joins every open branch of the history.
  repeated string parents = 5;
  string body = 6;
}

message ProjectServiceContextNoteResponse {
  ContextEvent event = 1;
}

message ProjectServiceLogRequest {
  Scope scope = 1;
  // Milliseconds since the Unix epoch; 0 reads from the start.
  int64 since = 2;
  // Only this task's events, when set.
  string task = 3;
}

message ProjectServiceLogResponse {
  // Parents before children, then by time.
  repeated ContextEvent events = 1;
  // The events nothing follows yet, over the whole history.
  repeated string heads = 2;
  // The events as a list for people, grouped by UTC date.
  string text = 3;
}
