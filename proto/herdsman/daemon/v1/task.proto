syntax = "proto3";

package herdsman.daemon.v1;

import "herdsman/core/v1/core.proto";
import "herdsman/daemon/v1/project.proto";

option go_package = "github.com/arafathusayn/herdsman/sdk/daemon/v1;daemonv1";

// TaskService keeps the task records of every project.
service TaskService {
  // Create stores a task under a project.
  rpc Create(TaskServiceCreateRequest) returns (TaskServiceCreateResponse);
  // Get returns one task.
  rpc Get(TaskServiceGetRequest) returns (TaskServiceGetResponse);
  // List returns the matching tasks by slug.
  rpc List(TaskServiceListRequest) returns (TaskServiceListResponse);
  // Update changes a task. A task's project cannot be changed.
  rpc Update(TaskServiceUpdateRequest) returns (TaskServiceUpdateResponse);
  // Delete removes a task.
  rpc Delete(TaskServiceDeleteRequest) returns (TaskServiceDeleteResponse);
  // Link attaches a pull request, an issue or a URL to a task.
  rpc Link(TaskServiceLinkRequest) returns (TaskServiceLinkResponse);
  // New makes a task's worktree: base, names, the tree, its hooks and setup.
  rpc New(TaskServiceNewRequest) returns (TaskServiceNewResponse);
  // Go finds the worktree a selector means, making one for a pull request.
  rpc Go(TaskServiceGoRequest) returns (TaskServiceGoResponse);
}

message TaskServiceCreateRequest {
  Scope scope = 1;
  string title = 2;
  // Generated from the title when empty.
  string slug = 3;
  string body = 4;
  repeated string labels = 5;
  // Every repository of the project when empty.
  repeated string repos = 6;
}

message TaskServiceCreateResponse {
  herdsman.core.v1.Task task = 1;
}

message TaskServiceGetRequest {
  Scope scope = 1;
  // A slug, an id, or "@" for the task of the current worktree.
  string task = 2;
}

message TaskServiceGetResponse {
  herdsman.core.v1.Task task = 1;
}

message TaskServiceListRequest {
  // Ignored when all is true.
  Scope scope = 1;
  bool all = 2;
  // One of todo, doing, review, done, archived; empty for any.
  string status = 3;
  string repo = 4;
  string label = 5;
}

message TaskServiceListResponse {
  repeated herdsman.core.v1.Task tasks = 1;
}

// TaskServiceUpdateRequest names the task through its scope but has no field
// that sets a project.
message TaskServiceUpdateRequest {
  Scope scope = 1;
  string task = 2;
  optional string title = 3;
  optional string body = 4;
  optional string status = 5;
  repeated string add_repos = 6;
  repeated string remove_repos = 7;
  repeated string add_labels = 8;
  repeated string remove_labels = 9;
}

message TaskServiceUpdateResponse {
  herdsman.core.v1.Task task = 1;
}

message TaskServiceDeleteRequest {
  Scope scope = 1;
  string task = 2;
  bool force = 3;
}

message TaskServiceDeleteResponse {}

message TaskServiceLinkRequest {
  Scope scope = 1;
  string task = 2;
  // pr:<n>, issue:<n> or a URL.
  string link = 3;
  // May be empty when the task names one repository.
  string repo = 4;
}

message TaskServiceLinkResponse {
  herdsman.core.v1.Task task = 1;
}

message TaskServiceNewRequest {
  // The caller's folder, absolute: it selects the repository.
  string dir = 1;
  string task = 2;
  // Empty means the repository's default branch.
  string base = 3;
  // A pull request to start from: pr:<n> or a URL.
  string from = 4;
  // The branch's type prefix; empty means feat.
  string type = 5;
  // The command that starts an agent in the worktree.
  string agent = 6;
  string prompt = 7;
  bool no_setup = 8;
  // Rename a stale folder at the path aside.
  bool clobber = 9;
  // The caller's environment, as NAME=value, for hooks and for finding herdr.
  repeated string environ = 10;
}

message TaskServiceNewResponse {
  // The version of this response's shape.
  string schema_version = 1;
  string task = 2;
  string branch = 3;
  string path = 4;
  string base = 5;
  int32 port = 6;
  // Whether herdr made or opened the worktree.
  bool herdr = 7;
  repeated string setup = 8;
  // The command line that enters the worktree.
  string launch = 9;
  repeated string logs = 10;
  repeated string warnings = 11;
  // The agent started in the worktree; empty when none was.
  string agent_name = 12;
  // The ports reserved for the task, starting at port.
  repeated int32 ports = 13;
}

message TaskServiceGoRequest {
  // The caller's folder, absolute: it selects the repository.
  string dir = 1;
  // A task, branch or path, one of ^ @ -, pr:<n> or a URL.
  string selector = 2;
  // Also focus the worktree's herdr pane.
  bool focus = 3;
  // The caller's environment, as NAME=value, for hooks and for finding herdr.
  repeated string environ = 4;
}

message TaskServiceGoResponse {
  // The version of this response's shape.
  string schema_version = 1;
  string task = 2;
  string branch = 3;
  string path = 4;
  // Whether the call made the worktree.
  bool created = 5;
  bool focused = 6;
  // The remote a fork's branch pushes to; empty for other branches.
  string push_remote = 7;
  repeated string warnings = 8;
}
