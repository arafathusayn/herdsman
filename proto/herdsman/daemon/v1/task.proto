syntax = "proto3";

package herdsman.daemon.v1;

import "herdsman/core/v1/core.proto";
import "herdsman/daemon/v1/project.proto";

option go_package = "github.com/arafathusayn/herdsman/sdk/daemon/v1;daemonv1";

// TaskService keeps the task records of every project.
service TaskService {
  // Create stores a task under a project.
  rpc Create(TaskServiceCreateRequest) returns (TaskServiceCreateResponse);
  // Get returns one task.
  rpc Get(TaskServiceGetRequest) returns (TaskServiceGetResponse);
  // List returns the matching tasks by slug.
  rpc List(TaskServiceListRequest) returns (TaskServiceListResponse);
  // Update changes a task. A task's project cannot be changed.
  rpc Update(TaskServiceUpdateRequest) returns (TaskServiceUpdateResponse);
  // Delete removes a task.
  rpc Delete(TaskServiceDeleteRequest) returns (TaskServiceDeleteResponse);
  // Link attaches a pull request, an issue or a URL to a task.
  rpc Link(TaskServiceLinkRequest) returns (TaskServiceLinkResponse);
}

message TaskServiceCreateRequest {
  Scope scope = 1;
  string title = 2;
  // Generated from the title when empty.
  string slug = 3;
  string body = 4;
  repeated string labels = 5;
  // Every repository of the project when empty.
  repeated string repos = 6;
  // Report the plan and change nothing.
  bool dry_run = 7;
}

message TaskServiceCreateResponse {
  herdsman.core.v1.Task task = 1;
  // What the request would do; set only for dry_run.
  herdsman.core.v1.Plan plan = 2;
}

message TaskServiceGetRequest {
  Scope scope = 1;
  // A slug, an id, or "@" for the task of the current worktree.
  string task = 2;
}

message TaskServiceGetResponse {
  herdsman.core.v1.Task task = 1;
}

message TaskServiceListRequest {
  // Ignored when all is true.
  Scope scope = 1;
  bool all = 2;
  // One of todo, doing, review, done, archived; empty for any.
  string status = 3;
  string repo = 4;
  string label = 5;
}

message TaskServiceListResponse {
  repeated herdsman.core.v1.Task tasks = 1;
}

// TaskServiceUpdateRequest names the task through its scope but has no field
// that sets a project.
message TaskServiceUpdateRequest {
  Scope scope = 1;
  string task = 2;
  optional string title = 3;
  optional string body = 4;
  optional string status = 5;
  repeated string add_repos = 6;
  repeated string remove_repos = 7;
  repeated string add_labels = 8;
  repeated string remove_labels = 9;
  // Report the plan and change nothing.
  bool dry_run = 10;
}

message TaskServiceUpdateResponse {
  herdsman.core.v1.Task task = 1;
  // What the request would do; set only for dry_run.
  herdsman.core.v1.Plan plan = 2;
}

message TaskServiceDeleteRequest {
  Scope scope = 1;
  string task = 2;
  bool force = 3;
  // Report the plan and change nothing.
  bool dry_run = 4;
}

message TaskServiceDeleteResponse {
  // What the request would do; set only for dry_run.
  herdsman.core.v1.Plan plan = 1;
}

message TaskServiceLinkRequest {
  Scope scope = 1;
  string task = 2;
  // pr:<n>, issue:<n> or a URL.
  string link = 3;
  // May be empty when the task names one repository.
  string repo = 4;
  // Report the plan and change nothing.
  bool dry_run = 5;
}

message TaskServiceLinkResponse {
  herdsman.core.v1.Task task = 1;
  // What the request would do; set only for dry_run.
  herdsman.core.v1.Plan plan = 2;
}
