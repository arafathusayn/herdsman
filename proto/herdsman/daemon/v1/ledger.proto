syntax = "proto3";

// Services of the herdsman daemon.
package herdsman.daemon.v1;

option go_package = "github.com/arafathusayn/herdsman/sdk/daemon/v1;daemonv1";

// LedgerService reports what a task runs and records what it owns.
service LedgerService {
  // Resources lists a task's records and the live plan built from them.
  rpc Resources(ResourcesRequest) returns (ResourcesResponse);
  // Plan builds the teardown plan for a task without acting on it.
  rpc Plan(PlanRequest) returns (PlanResponse);
  // AddResource records authority over a resource for one execution.
  rpc AddResource(AddResourceRequest) returns (AddResourceResponse);
  // TeardownPlans builds one plan per selected task and changes nothing.
  rpc TeardownPlans(TeardownPlansRequest) returns (TeardownPlansResponse);
  // Teardown runs approved plans, each as one journaled operation.
  rpc Teardown(TeardownRequest) returns (TeardownResponse);
  // RegisterResource records a resource for a task found from a folder.
  rpc RegisterResource(RegisterResourceRequest) returns (RegisterResourceResponse);
  // LedgerHealth lists what a folder's task still runs that it alone owns.
  rpc LedgerHealth(LedgerHealthRequest) returns (LedgerHealthResponse);
}

message ResourcesRequest {
  // common_dir is the repository's common git directory.
  string common_dir = 1;
  string task = 2;
}

message PlanRequest {
  // common_dir is the repository's common git directory.
  string common_dir = 1;
  string task = 2;
}

message PlanResponse {
  TeardownPlan plan = 1;
}

message ResourceRecord {
  string task = 1;
  string execution = 2;
  string kind = 3;
  string id = 4;
  // start is the RFC 3339 process start or resource creation time.
  string start = 5;
  string command = 6;
  bool adopted = 7;
}

// ResourceLine is one line of a plan document; readers ignore what they do
// not know.
message ResourceLine {
  string kind = 1;
  string id = 2;
  string identity = 3;
  string level = 4;
  string class = 5;
  string action = 6;
  repeated string signals = 7;
  repeated string shared_with = 8;
  string role = 9;
}

message TeardownPlan {
  string schema_version = 1;
  string task = 2;
  string execution = 3;
  string worktree = 4;
  repeated ResourceLine lines = 5;
}

message ResourcesResponse {
  repeated ResourceRecord records = 1;
  TeardownPlan plan = 2;
}

message AddResourceRequest {
  string common_dir = 1;
  string task = 2;
  // execution is empty to use the task's newest execution.
  string execution = 3;
  string kind = 4;
  string id = 5;
  bool adopted = 6;
  string source = 7;
}

message AddResourceResponse {
  ResourceRecord record = 1;
}

message TeardownPlansRequest {
  // dir is an absolute folder inside the repository.
  string dir = 1;
  // selector names one task; empty means the task of dir.
  string selector = 2;
  // route selects every task of a route folder.
  string route = 3;
  // all selects every task.
  bool all = 4;
}

message TeardownPlansResponse {
  // plans are versioned plan documents, each a JSON object. Teardown takes
  // them back byte for byte, so the identity of what was approved holds.
  repeated bytes plans = 1;
  // hooks says a teardown would run configured hooks even with nothing to stop.
  bool hooks = 2;
}

message TeardownRequest {
  // dir is an absolute folder inside the repository.
  string dir = 1;
  // plans are documents from TeardownPlans that a person approved.
  repeated bytes plans = 2;
  // grace_seconds is the wait before a forced stop; zero takes the default.
  int32 grace_seconds = 3;
  // include_associated also stops what is only associated with the task.
  bool include_associated = 4;
}

message TeardownOutcome {
  string kind = 1;
  string id = 2;
  string level = 3;
  string result = 4;
}

message TeardownReport {
  string task = 1;
  repeated TeardownOutcome outcomes = 2;
  // error is empty when every approved stop finished.
  string error = 3;
}

message TeardownResponse {
  repeated TeardownReport reports = 1;
}

message RegisterResourceRequest {
  // dir is an absolute folder inside the repository.
  string dir = 1;
  // task is empty to use the task of dir.
  string task = 2;
  // execution is empty to use the task's newest execution.
  string execution = 3;
  string kind = 4;
  string id = 5;
}

message RegisterResourceResponse {
  ResourceRecord record = 1;
}

message LedgerHealthRequest {
  // dir is an absolute folder inside the task's worktree.
  string dir = 1;
}

message LedgerHealthResponse {
  repeated ResourceLine running = 1;
}
